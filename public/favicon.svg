<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background square with rounded corners -->
  <rect width="100" height="100" rx="18" fill="#FEFEFE"/>

  <!-- Simplified bold E in green (two horizontal bars + spine, no bottom bar) -->
  <!-- Vertical spine -->
  <rect x="18" y="20" width="12" height="60" fill="#308A4B"/>
  <!-- Top bar -->
  <rect x="18" y="20" width="46" height="12" fill="#308A4B"/>
  <!-- Middle bar -->
  <rect x="18" y="44" width="36" height="12" fill="#308A4B"/>
  <!-- Bottom bar -->
  <rect x="18" y="68" width="46" height="12" fill="#308A4B"/>

</svg>
